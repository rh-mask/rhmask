name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: push rules (history, files, terms, typecheck, lint, stealth, build)
        run: node scripts/prepush-check.mjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
